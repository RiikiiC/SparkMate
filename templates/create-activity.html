<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark Mate - Create</title>
    <link rel="stylesheet" href="../static/css/main.css">

    <meta name="description" content="SparkMate helps people easily find the right companion for these moments and rebuild a sense of connection and belonging."> 
    <meta name="keywords" content="activities, hobby circle, meetup, friends, events"> 
    <link rel="author" content="Riikii"/>

    <meta property="og:title" content="Spark Mate">
    <meta property="og:description" content="Discover activities and meet people with the same hobbies.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/static/images/logo.png">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Spark Mate">
    <meta name="twitter:description" content="Discover activities and meet new friends.">
    <meta name="twitter:image" content="/static/images/logo.png">

    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/images/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/static/images/favicon_io/site.webmanifest">
</head>
<body>
    <header>
        <a href="/">
            <img src="/static/images/logo.png" alt="logo" class="logo">
        </a>

        <nav class="nav">
            <input type="text" class="search" placeholder="">
            <a href="/events" class="nav-link active">recent</a>
            <a href="/#">near</a>
            <a href="/circles">circles</a>
            <a href="/account" class="account-link">
                <img src="/static/images/account.png" alt="Account">
            </a>
        </nav>
    </header>

    <main class="creat-page">

        <h1 class="create-title">Create Activity</h1>

        <form class="create-form" action="/create" method="POST" enctype="multipart/form-data">
            <div class="create-row">
                <label for="title" class="label">Theme:</label>
                <input type="text" id="title" name="title" class="input" required>
            </div>

            <div class="create-row">
                <label for="circle" class="label">Circle:</label>
                <select id="circle" name="circle" class="input" required>
                    <option value="">Choose...</option>
                    <option value="Museum">Museum</option>
                    <option value="Market">Market</option>
                    <option value="Sports">Sports</option>
                </select>
            </div>

            <div class="create-row">
                <label for="detail" class="label">Detail:</label>
                <textarea id="detail" name="detail" rows="5" class="input" required></textarea>
            </div>

            <div class="create-row">
                <label for="picture" class="upload-box">+</label>
                <div class="upload-text">
                    Upload picture<br>
                    (Optional)
                </div>
                <input type="file" id="picture" name="picture" class="upload-input">
            </div>

            <div class="create-row">
                <label for="event_date" class="label">Date:</label>
                <input type="date" id="event_date" name="event_date" class="input" required>
            </div>

            <div class="create-row">
                <label for="time_start" class="label">Time:</label>
                <input type="time" id="time_start" name="time_start" class="input" required>
                <span style="padding: 0 4px;">-</span>
                <input type="time" id="time_end" name="time_end" class="input" required>
            </div>

            <div class="create-row">
                <label for="location" class="label">Location:</label>
                <input type="text" id="location" name="location" class="input" required>
            </div>

            <div class="create-row">
                <label for="budget" class="label">Budget:</label>
                <input type="text" id="budget" name="budget" class="input">
            </div>

            <button type="submit" class="submit-btn">SUBMIT</button>
        </form>

    </main>

    <footer>
        <div class="footer-info">
            <a href="/#">About us</a>
            <a href="/#">Contact</a>
            <div class="footer-icons">
                <a href="#" aria-label="Facebook">
                    <img src="/static/images/fb.png" alt="Facebook">
                </a>
                <a href="#" aria-label="X">
                    <img src="/static/images/x.png" alt="X">
                </a>
                <a href="#" aria-label="Instagram">
                    <img src="/static/images/ig.png" alt="Instagram">
                </a>
                <a href="#" aria-label="Youtube">
                    <img src="/static/images/yt.png" alt="Youtube">
                </a>
            </div>
        </div>
        <img src="/static/images/logo.png" alt="Spark Mate logo" class="footer-logo">
    </footer>

    <script src="/static/js/main.js"></script>
</body>
</html>
